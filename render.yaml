# render.yaml — Render 部署設定
# 這個檔案放在 GitHub repo 根目錄，Render 會自動讀取

services:
  - type: cron                          # 排程任務（不是 Web 服務）
    name: threads-followers-scraper
    runtime: python
    plan: free                          # 免費方案即可
    schedule: "0 15 * * *"             # UTC 15:00 = 台北 23:00
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps chromium
    startCommand: python scraper.py
    envVars:
      - key: GOOGLE_CREDS_JSON
        sync: false                     # 在 Render Dashboard 手動填入，不寫在這裡
