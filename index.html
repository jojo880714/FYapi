<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧵 Threads 監控儀表板</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        :root {
            --primary: #1a1a1a;
            --secondary: #2d2d2d;
            --accent: #ff3366;
            --accent-soft: #ff6b8a;
            --bg: #fafafa;
            --bg-card: #ffffff;
            --text: #1a1a1a;
            --text-muted: #666666;
            --border: #e0e0e0;
            --success: #00c853;
            --warning: #ffa726;
            --shadow: rgba(0, 0, 0, 0.08);
            --shadow-lg: rgba(0, 0, 0, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 3rem 0;
            margin-bottom: 3rem;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.3;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 3rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: white;
            color: var(--primary);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn-accent {
            background: var(--accent);
            color: white;
        }

        .btn-accent:hover {
            background: var(--accent-soft);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 51, 102, 0.3);
        }

        /* Filters */
        .filters {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 2px 12px var(--shadow);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-group select {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.95rem;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 51, 102, 0.1);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 2px 12px var(--shadow);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px var(--shadow-lg);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .stat-card:hover::before {
            transform: scaleY(1);
        }

        .stat-icon {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .stat-value {
            font-family: 'DM Serif Display', serif;
            font-size: 2.5rem;
            font-weight: 400;
            color: var(--primary);
            margin-bottom: 0.25rem;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat-change {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-top: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .stat-change.positive {
            background: rgba(0, 200, 83, 0.1);
            color: var(--success);
        }

        .stat-change.negative {
            background: rgba(255, 51, 102, 0.1);
            color: var(--accent);
        }

        /* Charts Section */
        .charts-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 968px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 2px 12px var(--shadow);
        }

        .chart-card h3 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        /* Top Posts */
        .top-posts {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 2px 12px var(--shadow);
            margin-bottom: 2rem;
        }

        .top-posts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .top-posts h3 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            font-weight: 400;
        }

        .top-posts-sort {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.9rem;
            background: white;
            cursor: pointer;
        }

        .top-post-item {
            display: flex;
            gap: 1rem;
            padding: 1.5rem;
            border-radius: 12px;
            background: var(--bg);
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .top-post-item:hover {
            background: #f0f0f0;
            transform: translateX(8px);
        }

        .post-rank {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            font-weight: 400;
            color: var(--accent);
            min-width: 50px;
        }

        .post-content {
            flex: 1;
        }

        .post-text {
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-meta {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .post-meta span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Posts List */
        .posts-list {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 2px 12px var(--shadow);
        }

        .posts-list h3 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
        }

        .post-item {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .post-item:hover {
            background: var(--bg);
        }

        .post-item:last-child {
            border-bottom: none;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.75rem;
        }

        .post-date {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .post-tags {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .tag {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            background: var(--bg);
            color: var(--text-muted);
        }

        .post-stats {
            display: flex;
            gap: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .post-stats span {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .view-detail-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: white;
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .view-detail-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }

        .spinner {
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .header-actions {
                flex-direction: column;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.8rem;
            font-weight: 400;
        }

        .close-btn {
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: var(--bg);
            color: var(--text);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 51, 102, 0.1);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <h1>🧵 Threads 監控儀表板</h1>
            <p>追蹤你的 Threads 內容表現與受眾洞察</p>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="refreshData()">
                    🔄 更新數據
                </button>
                <button class="btn btn-secondary" onclick="openPostModal()">
                    ➕ 發布貼文
                </button>
                <button class="btn btn-secondary" onclick="fetchAudienceInsights()">
                    👥 受眾洞察
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label>帳號</label>
                <select id="accountFilter" onchange="applyFilters()">
                    <option value="all">所有帳號</option>
                </select>
            </div>
            <div class="filter-group">
                <label>主題</label>
                <select id="topicFilter" onchange="applyFilters()">
                    <option value="all">所有主題</option>
                </select>
            </div>
            <div class="filter-group">
                <label>地區</label>
                <select id="regionFilter" onchange="applyFilters()">
                    <option value="all">所有地區</option>
                </select>
            </div>
            <div class="filter-group">
                <label>月份</label>
                <select id="monthFilter" onchange="applyFilters()">
                    <option value="all">所有月份</option>
                </select>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="totalPosts">0</div>
                <div class="stat-label">總貼文數</div>
                <div class="stat-change positive">+12% 較上月</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👁️</div>
                <div class="stat-value" id="totalViews">0</div>
                <div class="stat-label">總瀏覽數</div>
                <div class="stat-change positive">+18% 較上月</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💫</div>
                <div class="stat-value" id="avgViews">0</div>
                <div class="stat-label">平均瀏覽數</div>
                <div class="stat-change positive">+5% 較上月</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">❤️</div>
                <div class="stat-value" id="engagementRate">0%</div>
                <div class="stat-label">互動率</div>
                <div class="stat-change positive">+3% 較上月</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 發文趨勢（近7天）</h3>
                <canvas id="trendChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>🎯 主題分布</h3>
                <canvas id="topicChart"></canvas>
            </div>
        </div>

        <!-- Top 3 Posts -->
        <div class="top-posts">
            <div class="top-posts-header">
                <h3>🏆 本月 Top 3 貼文</h3>
                <select class="top-posts-sort" onchange="sortTop3(this.value)">
                    <option value="views">依瀏覽數</option>
                    <option value="engagement">依互動數</option>
                </select>
            </div>
            <div id="topPostsList">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>載入中...</p>
                </div>
            </div>
        </div>

        <!-- Posts List -->
        <div class="posts-list">
            <h3>📝 貼文列表</h3>
            <div id="postsList">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>載入貼文資料...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Post Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>發布新貼文</h2>
                <button class="close-btn" onclick="closeModal('postModal')">✕</button>
            </div>
            <form onsubmit="submitPost(event)">
                <div class="form-group">
                    <label>貼文內容</label>
                    <textarea id="postContent" placeholder="輸入你的貼文內容..." required></textarea>
                </div>
                <div class="form-group">
                    <label>主題標籤</label>
                    <input type="text" id="postTopic" placeholder="例如：遊學、留學" required>
                </div>
                <div class="form-group">
                    <label>地區</label>
                    <input type="text" id="postRegion" placeholder="例如：英國、澳洲">
                </div>
                <div class="form-group">
                    <label>CTA 連結（選填）</label>
                    <input type="url" id="postCTA" placeholder="https://example.com">
                </div>
                <button type="submit" class="btn btn-accent" style="width: 100%;">發布貼文</button>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let allPosts = [];
        let filteredPosts = [];
        let trendChart, topicChart;

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            refreshData();
        });

        // Refresh data from API
        async function refreshData() {
            try {
                const response = await fetch(`${CONFIG.API_URL}?action=getPostsData`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    allPosts = data.posts;
                    filteredPosts = allPosts;
                    
                    updateStats();
                    updateFilters();
                    updateCharts();
                    updatePostsList();
                    fetchTop3Posts();
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                alert('無法載入數據，請檢查 API 連線');
            }
        }

        // Update statistics
        function updateStats() {
            const totalPosts = filteredPosts.length;
            const totalViews = filteredPosts.reduce((sum, post) => sum + (post.views || 0), 0);
            const avgViews = totalPosts > 0 ? Math.round(totalViews / totalPosts) : 0;
            
            const totalEngagement = filteredPosts.reduce((sum, post) => 
                sum + (post.likes || 0) + (post.comments || 0) + (post.shares || 0) + (post.saves || 0), 0);
            const engagementRate = totalViews > 0 ? ((totalEngagement / totalViews) * 100).toFixed(1) : 0;

            document.getElementById('totalPosts').textContent = totalPosts.toLocaleString();
            document.getElementById('totalViews').textContent = (totalViews / 1000).toFixed(1) + 'K';
            document.getElementById('avgViews').textContent = avgViews.toLocaleString();
            document.getElementById('engagementRate').textContent = engagementRate + '%';
        }

        // Update filters
        function updateFilters() {
            const accounts = [...new Set(allPosts.map(p => p.account))];
            const topics = [...new Set(allPosts.map(p => p.topic))];
            const regions = [...new Set(allPosts.map(p => p.region))];
            const months = [...new Set(allPosts.map(p => p.date?.substring(0, 7)))];

            updateSelectOptions('accountFilter', accounts);
            updateSelectOptions('topicFilter', topics);
            updateSelectOptions('regionFilter', regions);
            updateSelectOptions('monthFilter', months);
        }

        function updateSelectOptions(selectId, options) {
            const select = document.getElementById(selectId);
            const currentValue = select.value;
            
            select.innerHTML = '<option value="all">所有' + select.previousElementSibling.textContent + '</option>';
            options.filter(Boolean).forEach(option => {
                select.innerHTML += `<option value="${option}">${option}</option>`;
            });
            
            if (options.includes(currentValue)) {
                select.value = currentValue;
            }
        }

        // Apply filters
        function applyFilters() {
            const account = document.getElementById('accountFilter').value;
            const topic = document.getElementById('topicFilter').value;
            const region = document.getElementById('regionFilter').value;
            const month = document.getElementById('monthFilter').value;

            filteredPosts = allPosts.filter(post => {
                return (account === 'all' || post.account === account) &&
                       (topic === 'all' || post.topic === topic) &&
                       (region === 'all' || post.region === region) &&
                       (month === 'all' || post.date?.startsWith(month));
            });

            updateStats();
            updateCharts();
            updatePostsList();
        }

        // Update charts
        function updateCharts() {
            updateTrendChart();
            updateTopicChart();
        }

        function updateTrendChart() {
            const last7Days = getLast7Days();
            const viewsByDate = {};
            
            last7Days.forEach(date => viewsByDate[date] = 0);
            filteredPosts.forEach(post => {
                if (post.date && viewsByDate.hasOwnProperty(post.date)) {
                    viewsByDate[post.date] += post.views || 0;
                }
            });

            const ctx = document.getElementById('trendChart');
            if (trendChart) trendChart.destroy();
            
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: last7Days,
                    datasets: [{
                        label: '瀏覽數',
                        data: Object.values(viewsByDate),
                        borderColor: '#ff3366',
                        backgroundColor: 'rgba(255, 51, 102, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function updateTopicChart() {
            const topicCounts = {};
            filteredPosts.forEach(post => {
                topicCounts[post.topic] = (topicCounts[post.topic] || 0) + 1;
            });

            const ctx = document.getElementById('topicChart');
            if (topicChart) topicChart.destroy();
            
            topicChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(topicCounts),
                    datasets: [{
                        data: Object.values(topicCounts),
                        backgroundColor: [
                            '#ff3366',
                            '#ff6b8a',
                            '#ffa726',
                            '#00c853',
                            '#2d2d2d'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Get last 7 days
        function getLast7Days() {
            const dates = [];
            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                dates.push(date.toISOString().split('T')[0]);
            }
            return dates;
        }

        // Fetch Top 3 Posts
        async function fetchTop3Posts() {
            try {
                const response = await fetch(`${CONFIG.API_URL}?action=getTop3Posts`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    renderTop3Posts(data.posts);
                }
            } catch (error) {
                console.error('Error fetching top 3:', error);
            }
        }

        function renderTop3Posts(posts) {
            const container = document.getElementById('topPostsList');
            
            if (posts.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666;">暫無貼文資料</p>';
                return;
            }

            const medals = ['🥇', '🥈', '🥉'];
            container.innerHTML = posts.slice(0, 3).map((post, index) => `
                <div class="top-post-item">
                    <div class="post-rank">${medals[index]}</div>
                    <div class="post-content">
                        <div class="post-text">${post.content || '貼文內容...'}</div>
                        <div class="post-meta">
                            <span>👁️ ${(post.views || 0).toLocaleString()}</span>
                            <span>❤️ ${(post.likes || 0).toLocaleString()}</span>
                            <span>💬 ${(post.comments || 0).toLocaleString()}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Update posts list
        function updatePostsList() {
            const container = document.getElementById('postsList');
            
            if (filteredPosts.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 2rem;">沒有符合條件的貼文</p>';
                return;
            }

            container.innerHTML = filteredPosts.slice(0, 20).map(post => `
                <div class="post-item">
                    <div class="post-header">
                        <span class="post-date">${post.date || '未知日期'}</span>
                        <button class="view-detail-btn" onclick="viewPostDetail('${post.id}')">查看詳情</button>
                    </div>
                    <div class="post-tags">
                        ${post.topic ? `<span class="tag">${post.topic}</span>` : ''}
                        ${post.region ? `<span class="tag">${post.region}</span>` : ''}
                    </div>
                    <div class="post-stats">
                        <span>👁️ ${(post.views || 0).toLocaleString()}</span>
                        <span>❤️ ${(post.likes || 0).toLocaleString()}</span>
                        <span>💬 ${(post.comments || 0).toLocaleString()}</span>
                        <span>🔄 ${(post.shares || 0).toLocaleString()}</span>
                    </div>
                </div>
            `).join('');
        }

        // Modal functions
        function openPostModal() {
            document.getElementById('postModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Submit post
        async function submitPost(event) {
            event.preventDefault();
            
            const postData = {
                action: 'createPost',
                content: document.getElementById('postContent').value,
                topic: document.getElementById('postTopic').value,
                region: document.getElementById('postRegion').value,
                cta: document.getElementById('postCTA').value
            };

            try {
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    body: JSON.stringify(postData)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('✅ 貼文發布成功！');
                    closeModal('postModal');
                    refreshData();
                } else {
                    alert('❌ 發布失敗：' + result.message);
                }
            } catch (error) {
                console.error('Error submitting post:', error);
                alert('❌ 發布失敗，請稍後再試');
            }
        }

        // Audience insights
        async function fetchAudienceInsights() {
            try {
                const response = await fetch(`${CONFIG.API_URL}?action=fetchAudienceInsights`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    alert('✅ 受眾洞察已更新至試算表「受眾洞察紀錄」');
                    console.log('Audience data:', data.insights);
                } else {
                    alert('❌ 無法取得受眾洞察：' + data.message);
                }
            } catch (error) {
                console.error('Error fetching insights:', error);
                alert('❌ 無法取得受眾洞察');
            }
        }

        function viewPostDetail(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (post) {
                alert('貼文詳情：\n' + JSON.stringify(post, null, 2));
            }
        }

        function sortTop3(sortBy) {
            // Implement sorting logic
            fetchTop3Posts();
        }
    </script>
</body>
</html>
