<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threads 監控儀表板</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5568d3;
            --secondary: #764ba2;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --dark: #1f2937;
            --light: #f9fafb;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        
        .stat-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(102, 126, 234, 0.4);
        }
        
        .filter-select {
            padding: 0.5rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            transition: all 0.3s ease;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .post-item {
            padding: 1rem;
            border-bottom: 1px solid #e5e7eb;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .post-item:hover {
            background: #f9fafb;
        }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        
        .badge-primary { background: #dbeafe; color: #1e40af; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <!-- 主容器 -->
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        
        <!-- 頂部導航 -->
        <div class="card mb-8 p-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">
                        <i class="fas fa-chart-line" style="color: var(--primary);"></i>
                        Threads 監控儀表板
                    </h1>
                    <p class="text-gray-600 mt-2">即時追蹤社群表現，優化內容策略</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="refreshData()" class="btn-primary">
                        <i class="fas fa-sync-alt mr-2"></i>
                        <span id="refreshBtn">更新數據</span>
                    </button>
                    <button onclick="openPublishModal()" class="btn-primary">
                        <i class="fas fa-plus mr-2"></i>
                        發布貼文
                    </button>
                </div>
            </div>
            
            <!-- 篩選器 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-6">
                <select id="filterAccount" class="filter-select" onchange="applyFilters()">
                    <option value="">全部帳號</option>
                </select>
                
                <select id="filterTopic" class="filter-select" onchange="applyFilters()">
                    <option value="">全部主題</option>
                </select>
                
                <select id="filterRegion" class="filter-select" onchange="applyFilters()">
                    <option value="">全部地區</option>
                </select>
                
                <select id="filterMonth" class="filter-select" onchange="applyFilters()">
                    <option value="">全部月份</option>
                    <option value="1">1月</option>
                    <option value="2">2月</option>
                    <option value="3">3月</option>
                    <option value="4">4月</option>
                    <option value="5">5月</option>
                    <option value="6">6月</option>
                    <option value="7">7月</option>
                    <option value="8">8月</option>
                    <option value="9">9月</option>
                    <option value="10">10月</option>
                    <option value="11">11月</option>
                    <option value="12">12月</option>
                </select>
            </div>
        </div>
        
        <!-- 統計卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm opacity-90">總貼文數</p>
                        <h3 class="text-3xl font-bold mt-2" id="statTotalPosts">0</h3>
                    </div>
                    <i class="fas fa-file-alt text-4xl opacity-50"></i>
                </div>
            </div>
            
            <div class="stat-card" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm opacity-90">總瀏覽數</p>
                        <h3 class="text-3xl font-bold mt-2" id="statTotalViews">0</h3>
                    </div>
                    <i class="fas fa-eye text-4xl opacity-50"></i>
                </div>
            </div>
            
            <div class="stat-card" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm opacity-90">平均瀏覽</p>
                        <h3 class="text-3xl font-bold mt-2" id="statAvgViews">0</h3>
                    </div>
                    <i class="fas fa-chart-bar text-4xl opacity-50"></i>
                </div>
            </div>
            
            <div class="stat-card" style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm opacity-90">互動率</p>
                        <h3 class="text-3xl font-bold mt-2" id="statEngagementRate">0%</h3>
                    </div>
                    <i class="fas fa-heart text-4xl opacity-50"></i>
                </div>
            </div>
        </div>
        
        <!-- 圖表區 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="card p-6">
                <h3 class="text-xl font-bold mb-4 text-gray-800">
                    <i class="fas fa-chart-line mr-2" style="color: var(--primary);"></i>
                    發文趨勢（7天）
                </h3>
                <canvas id="trendChart"></canvas>
            </div>
            
            <div class="card p-6">
                <h3 class="text-xl font-bold mb-4 text-gray-800">
                    <i class="fas fa-chart-pie mr-2" style="color: var(--primary);"></i>
                    主題分布
                </h3>
                <canvas id="topicChart"></canvas>
            </div>
        </div>
        
        <!-- Top 3 貼文 -->
        <div class="card p-6 mb-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-gray-800">
                    <i class="fas fa-trophy mr-2" style="color: #fbbf24;"></i>
                    本月 Top 3 貼文
                </h3>
                <select id="top3Metric" class="filter-select" onchange="loadTop3Posts()">
                    <option value="views">依瀏覽數</option>
                    <option value="engagement">依互動數</option>
                </select>
            </div>
            <div id="top3Container" class="space-y-4"></div>
        </div>
        
        <!-- 貼文列表 -->
        <div class="card p-6">
            <h3 class="text-xl font-bold mb-4 text-gray-800">
                <i class="fas fa-list mr-2" style="color: var(--primary);"></i>
                貼文列表
                <span class="text-sm font-normal text-gray-500 ml-2" id="postCount">(0 篇)</span>
            </h3>
            <div id="postsContainer"></div>
        </div>
        
    </div>
    
    <!-- 發布貼文 Modal -->
    <div id="publishModal" class="modal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-edit mr-2" style="color: var(--primary);"></i>
                    發布新貼文
                </h3>
                <button onclick="closePublishModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            
            <form onsubmit="submitPost(event)">
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">帳號</label>
                    <select id="publishAccount" class="filter-select w-full" required>
                        <option value="">選擇帳號</option>
                    </select>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">貼文內容</label>
                    <textarea id="publishContent" rows="6" class="filter-select w-full" 
                              placeholder="輸入貼文內容..." required></textarea>
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">圖片網址（選填）</label>
                    <input type="url" id="publishImage" class="filter-select w-full" 
                           placeholder="https://example.com/image.jpg">
                </div>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">主題（選填）</label>
                        <input type="text" id="publishTopic" class="filter-select w-full" 
                               placeholder="例：遊學">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">地區（選填）</label>
                        <input type="text" id="publishRegion" class="filter-select w-full" 
                               placeholder="例：英國">
                    </div>
                </div>
                
                <div class="flex gap-3">
                    <button type="submit" class="btn-primary flex-1">
                        <i class="fas fa-paper-plane mr-2"></i>
                        發布
                    </button>
                    <button type="button" onclick="closePublishModal()" 
                            class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300">
                        取消
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 貼文詳情 Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-2xl font-bold text-gray-800">
                    <i class="fas fa-info-circle mr-2" style="color: var(--primary);"></i>
                    貼文詳情
                </h3>
                <button onclick="closeDetailModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>
    
    <script>
// ═══════════════════════════════════════════════════════
// 🔧 設定區（使用方案三：LocalStorage 儲存 URL）
// ═══════════════════════════════════════════════════════

const CONFIG = {
    API_URL: localStorage.getItem('threads_gas_url') || '',
    ENDPOINTS: {
        getPosts: '?action=getPosts',
        getStats: '?action=getStats',
        getTop3: '?action=getTop3',
        getAccounts: '?action=getAccounts',
        getTopics: '?action=getTopics',
        createPost: '?action=createPost'
    }
};

let allPosts = [];
let filteredPosts = [];
let charts = {};

// ═══════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════

document.addEventListener('DOMContentLoaded', function() {
    initApp();
});

async function initApp() {
    // 如果沒有 URL，先詢問用戶
    if (!CONFIG.API_URL) {
        const url = prompt("https://script.google.com/macros/s/AKfycbwDF3W05aNdWhFJFM-nhdNXrKYoN8eNeDXJcrvVi7s3FIl66cg250yvtU-laqT8HGvR/exec");
        if (url) {
            localStorage.setItem('threads_gas_url', url);
            CONFIG.API_URL = url;
        } else {
            alert("未設定 API，網頁將無法運作。");
            return;
        }
    }

    showLoading();
    
    try {
        // 全面改用 fetch 調用
        const [accounts, topics, data] = await Promise.all([
            fetchAPI(CONFIG.ENDPOINTS.getAccounts),
            fetchAPI(CONFIG.ENDPOINTS.getTopics),
            fetchAPI(CONFIG.ENDPOINTS.getPosts)
        ]);

        setupDropdowns('filterAccount', accounts);
        setupDropdowns('publishAccount', accounts);
        setupDropdowns('filterTopic', topics);
        
        handlePostsData(data);
        hideLoading();
    } catch (error) {
        console.error('初始化失敗:', error);
        alert('連線至 GAS 失敗，請確認 API URL 是否正確且已發布為「任何人」。');
        hideLoading();
    }
}

// ═══════════════════════════════════════════════════════
// 核心：取代 google.script.run 的 fetch 函式
// ═══════════════════════════════════════════════════════

async function fetchAPI(endpoint, method = 'GET', bodyData = null) {
    const url = CONFIG.API_URL + endpoint;
    const options = {
        method: 'GET', // GAS 處理 CORS 建議優先使用 GET 帶 action 參數
        mode: 'cors'
    };

    if (method === 'POST') {
        // 注意：GAS 的 POST 處理較複雜，若純讀取建議皆用 GET
        options.method = 'POST';
        options.body = JSON.stringify(bodyData);
    }

    const response = await fetch(url, options);
    if (!response.ok) throw new Error('Network response was not ok');
    return await response.json();
}

function setupDropdowns(id, list) {
    const select = document.getElementById(id);
    if (!select) return;
    list.forEach(item => {
        const option = document.createElement('option');
        option.value = item;
        option.textContent = item;
        select.appendChild(option);
    });
}
        
        // ═══════════════════════════════════════════════════════
        // 資料載入
        // ═══════════════════════════════════════════════════════
        
        async function loadData() {
            try {
                // 使用 google.script.run 呼叫 GAS 函式
                google.script.run
                    .withSuccessHandler(handlePostsData)
                    .withFailureHandler(handleError)
                    .getPostsData();
                    
            } catch (error) {
                console.error('載入資料失敗:', error);
            }
        }
        
        function handlePostsData(data) {
            allPosts = data.posts || [];
            filteredPosts = allPosts;
            
            updateStats();
            renderPosts();
            renderCharts();
            loadTop3Posts();
        }
        
        function handleError(error) {
            console.error('API 錯誤:', error);
            alert('資料載入失敗');
        }
        
        async function loadAccounts() {
            google.script.run
                .withSuccessHandler(function(accounts) {
                    const select = document.getElementById('filterAccount');
                    const publishSelect = document.getElementById('publishAccount');
                    
                    accounts.forEach(account => {
                        const option = `<option value="${account}">${account}</option>`;
                        select.innerHTML += option;
                        publishSelect.innerHTML += option;
                    });
                })
                .getAccountList();
        }
        
        async function loadTopics() {
            google.script.run
                .withSuccessHandler(function(topics) {
                    const select = document.getElementById('filterTopic');
                    
                    topics.forEach(topic => {
                        select.innerHTML += `<option value="${topic}">${topic}</option>`;
                    });
                })
                .getTopicList();
        }
        
        async function loadTop3Posts() {
            const account = document.getElementById('filterAccount').value;
            const month = document.getElementById('filterMonth').value;
            const metric = document.getElementById('top3Metric').value;
            
            google.script.run
                .withSuccessHandler(function(top3) {
                    renderTop3(top3);
                })
                .getTop3Posts({
                    account: account || null,
                    month: month ? parseInt(month) : null,
                    metric: metric
                });
        }
        
        // ═══════════════════════════════════════════════════════
        // 篩選功能
        // ═══════════════════════════════════════════════════════
        
        function applyFilters() {
            const account = document.getElementById('filterAccount').value;
            const topic = document.getElementById('filterTopic').value;
            const region = document.getElementById('filterRegion').value;
            const month = document.getElementById('filterMonth').value;
            
            filteredPosts = allPosts.filter(post => {
                if (account && post.account !== account) return false;
                if (topic && post.topic !== topic) return false;
                if (region && post.region !== region) return false;
                
                if (month) {
                    const postMonth = new Date(post.timestamp).getMonth() + 1;
                    if (postMonth !== parseInt(month)) return false;
                }
                
                return true;
            });
            
            updateStats();
            renderPosts();
            renderCharts();
            loadTop3Posts();
        }
        
        // ═══════════════════════════════════════════════════════
        // 統計數據更新
        // ═══════════════════════════════════════════════════════
        
        function updateStats() {
            const totalPosts = filteredPosts.length;
            const totalViews = filteredPosts.reduce((sum, p) => sum + (p.views || 0), 0);
            const totalLikes = filteredPosts.reduce((sum, p) => sum + (p.likes || 0), 0);
            const totalReplies = filteredPosts.reduce((sum, p) => sum + (p.replies || 0), 0);
            
            const avgViews = totalPosts > 0 ? Math.round(totalViews / totalPosts) : 0;
            const engagementRate = totalViews > 0 ? ((totalLikes + totalReplies) / totalViews * 100).toFixed(2) : 0;
            
            document.getElementById('statTotalPosts').textContent = totalPosts.toLocaleString();
            document.getElementById('statTotalViews').textContent = totalViews.toLocaleString();
            document.getElementById('statAvgViews').textContent = avgViews.toLocaleString();
            document.getElementById('statEngagementRate').textContent = engagementRate + '%';
        }
        
        // ═══════════════════════════════════════════════════════
        // 貼文列表渲染
        // ═══════════════════════════════════════════════════════
        
        function renderPosts() {
            const container = document.getElementById('postsContainer');
            document.getElementById('postCount').textContent = `(${filteredPosts.length} 篇)`;
            
            if (filteredPosts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-inbox text-6xl mb-4"></i>
                        <p class="text-xl">沒有符合條件的貼文</p>
                    </div>
                `;
                return;
            }
            
            // 依時間排序
            const sorted = filteredPosts.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            let html = '';
            sorted.forEach(post => {
                const date = new Date(post.timestamp).toLocaleDateString('zh-TW');
                const content = (post.content || '').substring(0, 100) + '...';
                
                html += `
                    <div class="post-item" onclick="showPostDetail('${post.postId}')">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="badge badge-primary">${post.account}</span>
                                    ${post.topic ? `<span class="badge badge-success">${post.topic}</span>` : ''}
                                    ${post.region ? `<span class="badge badge-warning">${post.region}</span>` : ''}
                                </div>
                                <p class="text-gray-700 mb-2">${content}</p>
                                <div class="flex items-center gap-4 text-sm text-gray-500">
                                    <span><i class="far fa-calendar mr-1"></i>${date}</span>
                                    <span><i class="far fa-eye mr-1"></i>${(post.views || 0).toLocaleString()}</span>
                                    <span><i class="far fa-heart mr-1"></i>${(post.likes || 0).toLocaleString()}</span>
                                    <span><i class="far fa-comment mr-1"></i>${(post.replies || 0).toLocaleString()}</span>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-gray-400"></i>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ═══════════════════════════════════════════════════════
        // Top 3 渲染
        // ═══════════════════════════════════════════════════════
        
        function renderTop3(top3Posts) {
            const container = document.getElementById('top3Container');
            
            if (!top3Posts || top3Posts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-trophy text-4xl mb-2"></i>
                        <p>本月尚無數據</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            top3Posts.forEach((post, index) => {
                const medalColors = ['#fbbf24', '#d1d5db', '#cd7f32'];
                const medal = ['🥇', '🥈', '🥉'][index];
                
                html += `
                    <div class="p-4 rounded-lg border-2" style="border-color: ${medalColors[index]};">
                        <div class="flex items-start gap-4">
                            <div class="text-4xl">${medal}</div>
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-2">
                                    <span class="badge badge-primary">${post.account}</span>
                                    ${post.topic ? `<span class="badge badge-success">${post.topic}</span>` : ''}
                                </div>
                                <p class="text-gray-700 mb-3">${post.content}</p>
                                <div class="flex items-center gap-6 text-sm">
                                    <span class="font-semibold text-purple-600">
                                        <i class="far fa-eye mr-1"></i>
                                        ${(post.views || 0).toLocaleString()}
                                    </span>
                                    <span class="text-gray-600">
                                        <i class="far fa-heart mr-1"></i>
                                        ${(post.likes || 0).toLocaleString()}
                                    </span>
                                    <span class="text-gray-600">
                                        <i class="far fa-comment mr-1"></i>
                                        ${(post.replies || 0).toLocaleString()}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // ═══════════════════════════════════════════════════════
        // 圖表渲染
        // ═══════════════════════════════════════════════════════
        
        function renderCharts() {
            renderTrendChart();
            renderTopicChart();
        }
        
        function renderTrendChart() {
            // 計算最近 7 天的趨勢
            const days = [];
            const viewsData = [];
            const postsData = [];
            
            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = date.toLocaleDateString('zh-TW', { month: 'short', day: 'numeric' });
                days.push(dateStr);
                
                const dayPosts = filteredPosts.filter(p => {
                    const postDate = new Date(p.timestamp);
                    return postDate.toDateString() === date.toDateString();
                });
                
                const dayViews = dayPosts.reduce((sum, p) => sum + (p.views || 0), 0);
                viewsData.push(dayViews);
                postsData.push(dayPosts.length);
            }
            
            const ctx = document.getElementById('trendChart');
            
            if (charts.trend) {
                charts.trend.destroy();
            }
            
            charts.trend = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [{
                        label: '瀏覽數',
                        data: viewsData,
                        borderColor: 'rgb(102, 126, 234)',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }
        
        function renderTopicChart() {
            // 統計主題分布
            const topicMap = {};
            
            filteredPosts.forEach(post => {
                const topic = post.topic || '未分類';
                if (!topicMap[topic]) {
                    topicMap[topic] = 0;
                }
                topicMap[topic]++;
            });
            
            const labels = Object.keys(topicMap);
            const data = Object.values(topicMap);
            
            const ctx = document.getElementById('topicChart');
            
            if (charts.topic) {
                charts.topic.destroy();
            }
            
            charts.topic = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            'rgba(102, 126, 234, 0.8)',
                            'rgba(118, 75, 162, 0.8)',
                            'rgba(255, 99, 132, 0.8)',
                            'rgba(54, 162, 235, 0.8)',
                            'rgba(255, 206, 86, 0.8)',
                            'rgba(75, 192, 192, 0.8)'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'bottom'
                        }
                    }
                }
            });
        }
        
        // ═══════════════════════════════════════════════════════
        // Modal 控制
        // ═══════════════════════════════════════════════════════
        
        function openPublishModal() {
            document.getElementById('publishModal').classList.add('active');
        }
        
        function closePublishModal() {
            document.getElementById('publishModal').classList.remove('active');
            document.querySelector('#publishModal form').reset();
        }
        
        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }
        
        function showPostDetail(postId) {
            const post = allPosts.find(p => p.postId === postId);
            if (!post) return;
            
            const date = new Date(post.timestamp).toLocaleString('zh-TW');
            
            const html = `
                <div class="space-y-4">
                    <div>
                        <h4 class="font-semibold text-gray-700 mb-2">帳號</h4>
                        <span class="badge badge-primary">${post.account}</span>
                    </div>
                    
                    <div>
                        <h4 class="font-semibold text-gray-700 mb-2">發文時間</h4>
                        <p>${date}</p>
                    </div>
                    
                    <div>
                        <h4 class="font-semibold text-gray-700 mb-2">貼文內容</h4>
                        <p class="whitespace-pre-wrap">${post.content || ''}</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <h4 class="font-semibold text-gray-700 mb-2">主題</h4>
                            <p>${post.topic || '-'}</p>
                        </div>
                        <div>
                            <h4 class="font-semibold text-gray-700 mb-2">地區</h4>
                            <p>${post.region || '-'}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-4 p-4 bg-gray-50 rounded-lg">
                        <div class="text-center">
                            <i class="far fa-eye text-2xl text-purple-600 mb-2"></i>
                            <p class="text-2xl font-bold">${(post.views || 0).toLocaleString()}</p>
                            <p class="text-sm text-gray-600">瀏覽</p>
                        </div>
                        <div class="text-center">
                            <i class="far fa-heart text-2xl text-red-600 mb-2"></i>
                            <p class="text-2xl font-bold">${(post.likes || 0).toLocaleString()}</p>
                            <p class="text-sm text-gray-600">愛心</p>
                        </div>
                        <div class="text-center">
                            <i class="far fa-comment text-2xl text-blue-600 mb-2"></i>
                            <p class="text-2xl font-bold">${(post.replies || 0).toLocaleString()}</p>
                            <p class="text-sm text-gray-600">留言</p>
                        </div>
                    </div>
                    
                    ${post.permalink ? `
                        <a href="${post.permalink}" target="_blank" class="btn-primary w-full inline-block text-center">
                            <i class="fas fa-external-link-alt mr-2"></i>
                            在 Threads 查看
                        </a>
                    ` : ''}
                </div>
            `;
            
            document.getElementById('detailContent').innerHTML = html;
            document.getElementById('detailModal').classList.add('active');
        }
        
        // ═══════════════════════════════════════════════════════
        // 發文功能
        // ═══════════════════════════════════════════════════════
        
        function submitPost(event) {
            event.preventDefault();
            
            const postData = {
                action: 'createPost',
                account: document.getElementById('publishAccount').value,
                content: document.getElementById('publishContent').value,
                imageUrl: document.getElementById('publishImage').value,
                topic: document.getElementById('publishTopic').value,
                region: document.getElementById('publishRegion').value
            };
            
            showLoading();
            
            google.script.run
                .withSuccessHandler(function(result) {
                    hideLoading();
                    
                    if (result.success) {
                        alert('發布成功！');
                        closePublishModal();
                        refreshData();
                    } else {
                        alert('發布失敗：' + result.message);
                    }
                })
                .withFailureHandler(function(error) {
                    hideLoading();
                    alert('發布失敗：' + error.message);
                })
                .createPost(postData);
        }
        
        // ═══════════════════════════════════════════════════════
        // 工具函式
        // ═══════════════════════════════════════════════════════
        
        function refreshData() {
            showLoading();
            loadData();
        }
        
        function showLoading() {
            const btn = document.getElementById('refreshBtn');
            btn.innerHTML = '<span class="loading"></span>';
        }
        
        function hideLoading() {
            const btn = document.getElementById('refreshBtn');
            btn.innerHTML = '更新數據';
        }
    </script>
</body>
